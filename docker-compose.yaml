services:
  database:
    image: postgres:18.4
    container_name: fernando-personal-blog-db
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=fernando_personal_blog_db
    
    volumes:
      - db:/var/lib/postgresql


volumes:
  db: